# Builds .deb packages and attaches them to the GitHub Release.
# Called by release.yml (cargo-dist post-announce job) after the release is published,
# or run manually to add packages to an existing release.
name: Debian packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  deb:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb --locked
      - run: cargo deb
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PLAN: ${{ inputs.plan }}
        run: |
          if [ -z "$TAG" ]; then TAG=$(jq -r .announcement_tag <<< "$PLAN"); fi
          gh release upload "$TAG" target/debian/*.deb
